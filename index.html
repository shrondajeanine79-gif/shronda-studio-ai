<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F5F0E1">
  <meta name="description" content="Shronda Studio AI — a creative workspace for writing, brainstorming, and building ideas.">
  <title>Shronda Studio AI</title>

  <style>
    :root {
      --cream: #F5F0E1;
      --teal: #3C6E71;
      --gold: #D4AF37;
      --rose: #C08473;
      --indigo: #2C2A4A;
      --sage: #A8B2A1;
      --white: #FFFEFA;
      --text: #292B2B;
      --muted: #686B67;
      --border: #DDD7C8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--cream);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    button, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
    }

    .sidebar {
      padding: 28px 18px;
      background: var(--white);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 26px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-mark {
      width: 43px;
      height: 43px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: var(--teal);
      color: var(--gold);
      font-size: 25px;
      font-weight: 700;
    }

    .brand-name {
      font-size: 16px;
      font-weight: 750;
      line-height: 1.3;
    }

    .brand-caption {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .new-chat {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--teal);
      border-radius: 10px;
      background: var(--teal);
      color: white;
      font-weight: 650;
    }

    .side-label {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .tool-link {
      display: block;
      width: 100%;
      margin-bottom: 7px;
      padding: 11px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--text);
      text-align: left;
    }

    .tool-link:hover,
    .tool-link.active {
      background: #E9EDE5;
    }

    .sidebar-note {
      margin-top: auto;
      padding: 15px;
      border: 1px solid #E6D9AD;
      border-radius: 12px;
      background: #FBF5DE;
      font-size: 13px;
      line-height: 1.5;
    }

    .sidebar-note strong {
      display: block;
      margin-bottom: 5px;
      color: var(--teal);
    }

    .main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 19px 30px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 254, 250, 0.7);
    }

    .topbar-title {
      font-size: 14px;
      font-weight: 650;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4B8A62;
    }

    .saved-toggle {
      padding: 10px 13px;
      border: 1px solid var(--teal);
      border-radius: 10px;
      background: var(--white);
      color: var(--teal);
      font-size: 13px;
      font-weight: 700;
    }

    .saved-toggle:hover {
      background: #E9EDE5;
    }

    .saved-panel {
      margin: 20px 26px 0;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: var(--white);
    }

    .saved-panel[hidden] {
      display: none;
    }

    .saved-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 15px;
    }

    .saved-header h2 {
      margin: 0;
      color: var(--teal);
      font-size: 20px;
    }

    .close-saved {
      padding: 8px 11px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--cream);
      color: var(--text);
    }

      display: grid;
